<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planta 4 Estanques</title>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <style>
        /* Estilos basados en estándar HMI de Alto Desempeño (Gris, limpio) */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #d9d9d9; color: #333; margin: 0; padding: 20px; }
        .dashboard { display: flex; flex-wrap: wrap; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .panel { background: #ececec; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); border: 1px solid #ccc; }
        .panel-left { flex: 1 1 500px; }
        .panel-right { flex: 1 1 400px; display: flex; flex-direction: column; align-items: center; }
        
        h2 { color: #2c3e50; text-align: center; margin-top: 0; font-size: 1.2rem;}
        
        /* Controles */
        .controls { background: #f8f9fa; padding: 15px; border-radius: 6px; border: 1px solid #ddd; margin-bottom: 15px;}
        .slider-group { margin-bottom: 10px; }
        input[type=range] { width: 100%; cursor: pointer; }
        .sp-label { font-weight: bold; background-color: #fff200; padding: 2px 5px; border-radius: 3px; border: 1px solid #ccc; } /* SP en amarillo según UdeC */

        /* Reporte */
        .report { background: #2c3e50; color: white; padding: 15px; border-radius: 6px; font-family: 'Courier New', Courier, monospace; font-size: 14px; margin-top: 15px;}
        .status-ok { color: #2ecc71; font-weight: bold; }
        .status-warn { color: #f1c40f; font-weight: bold; }
        .status-err { color: #e74c3c; font-weight: bold; }

        /* Animación de Estanques (CSS SCADA) */
        .plant-synoptic { display: grid; grid-template-columns: 1fr 1fr; gap: 30px 60px; margin-top: 20px; position: relative;}
        .tank-container { display: flex; flex-direction: column; align-items: center; }
        .tank { width: 90px; height: 150px; background-color: #fff; border: 3px solid #7f8c8d; border-top: none; position: relative; overflow: hidden; border-radius: 0 0 5px 5px; box-shadow: inset 0 0 10px rgba(0,0,0,0.1);}
        .water { position: absolute; bottom: 0; width: 100%; background-color: #3498db; transition: height 1.5s ease-in-out, background-color 0.5s ease; }
        .water.overflow { background-color: #e74c3c; } /* Rojo si rebalsa */
        .tank-label { margin-top: 5px; font-size: 12px; font-weight: bold; }
        .tank-val { font-family: monospace; font-size: 14px; margin-top: 2px; }
        
        /* Líneas de tubería simuladas */
        .pipe-cross-1 { position: absolute; top: 120px; left: 60px; width: 100px; height: 3px; background: #7f8c8d; transform: rotate(30deg); z-index: 0;}
        .pipe-cross-2 { position: absolute; top: 120px; right: 60px; width: 100px; height: 3px; background: #7f8c8d; transform: rotate(-30deg); z-index: 0;}

    </style>
</head>
<body>

<div class="dashboard">
    <div class="panel panel-left">
        <h2>Panel de Operación y Restricciones Activas</h2>
        
        <div class="controls">
            <div class="slider-group">
                <label>SP Estanque 1: <span class="sp-label" id="val_h1">30</span> cm</label>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <input type="range" id="slider_h1" min="0" max="60" step="0.5" value="30" style="flex-grow: 1;">
                    <input type="number" id="input_h1_pct" min="0" max="100" step="0.1" value="50" style="width: 70px;">
                    <span>%</span>
                </div>
            </div>

            <div class="slider-group" style="margin-top: 15px;">
                <label>SP Estanque 2: <span class="sp-label" id="val_h2">30</span> cm</label>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <input type="range" id="slider_h2" min="0" max="60" step="0.5" value="30" style="flex-grow: 1;">
                    <input type="number" id="input_h2_pct" min="0" max="100" step="0.1" value="50" style="width: 70px;">
                    <span>%</span>
                </div>
            </div>
        </div>

        <div id="plot_div"></div>

        <div class="report" id="report_div"></div>
    </div>

    <div class="panel panel-right">
        <h2>Estanques </h2>
        
        <div class="plant-synoptic">
            <div class="pipe-cross-1"></div>
            <div class="pipe-cross-2"></div>
            
            <div class="tank-container">
                <div class="tank"><div class="water" id="water_3"></div></div>
                <div class="tank-label">Estanque 3 (Esclavo)</div>
                <div class="tank-val" id="text_h3">0.0 cm</div>
            </div>
            <div class="tank-container">
                <div class="tank"><div class="water" id="water_4"></div></div>
                <div class="tank-label">Estanque 4 (Esclavo)</div>
                <div class="tank-val" id="text_h4">0.0 cm</div>
            </div>

            <div class="tank-container" style="z-index: 1;">
                <div class="tank"><div class="water" id="water_1"></div></div>
                <div class="tank-label">Estanque 1 (Maestro)</div>
                <div class="tank-val" id="text_h1">0.0 cm</div>
            </div>
            <div class="tank-container" style="z-index: 1;">
                <div class="tank"><div class="water" id="water_2"></div></div>
                <div class="tank-label">Estanque 2 (Maestro)</div>
                <div class="tank-val" id="text_h2">0.0 cm</div>
            </div>
        </div>
    </div>
</div>

<script>
// --- FÍSICA Y PARÁMETROS (Basados en quad_op.py) ---
const g = 9.81;
const a1 = 6.1360e-04; // Área de fuga inferior Estanque 1
const a2 = 5.4678e-04; // Área de fuga inferior Estanque 2
const a3 = 3.5752e-04; // Área superior Estanque 3
const a4 = 4.1820e-04; // Área superior Estanque 4
const k = 0.0017;
const gamma1 = 0.455, gamma2 = 0.4195;
const U_MIN = 0.26, U_MAX = 1.00;
const H_MAX = 0.60; // 60 cm físicos

// --- MATRIZ INVERSA ---
const M11 = gamma1 * k, M12 = (1 - gamma2) * k;
const M21 = (1 - gamma1) * k, M22 = gamma2 * k;
const det = M11 * M22 - M12 * M21;
const I11 = M22 / det, I12 = -M12 / det;
const I21 = -M21 / det, I22 = M11 / det;

// Fórmulas desacopladas por área
function calcF(h, area) { return area * Math.sqrt(2 * g * h); }
function calcH(F, area) { return F < 0 ? -1 : Math.pow(F, 2) / (2 * g * Math.pow(area, 2)); }

// Validación estricta de alcanzabilidad física (Permite 0 o rango 26-100%)
function es_alcanzable(u) {
    let tol = 1e-4; // Tolerancia para errores de punto flotante
    if (Math.abs(u) < tol) return true;
    if (u >= (U_MIN - tol) && u <= (U_MAX + tol)) return true;
    return false;
}

// Función para actualizar nivel de agua visual y alarmas
function updateTankFill(tankId, textId, heightMeters) {
    let waterDiv = document.getElementById(tankId);
    let textDiv = document.getElementById(textId);
    let cm = heightMeters * 100;
    
    let fillPercent = (cm / (H_MAX * 100)) * 100;
    if(fillPercent > 100) fillPercent = 100;
    if(fillPercent < 0 || isNaN(fillPercent)) fillPercent = 0;

    waterDiv.style.height = fillPercent + '%';
    textDiv.innerText = cm.toFixed(1) + " cm";

    if(cm > (H_MAX * 100)) {
        waterDiv.classList.add('overflow');
        textDiv.style.color = '#e74c3c';
        textDiv.style.fontWeight = 'bold';
        textDiv.innerText += " (¡REBALSE!)";
    } else {
        waterDiv.classList.remove('overflow');
        textDiv.style.color = '#333';
        textDiv.style.fontWeight = 'normal';
    }
}

// Genera el polígono continuo cuando AMBAS bombas están encendidas (MIMO)
function generar_poligono_principal(umin, umax) {
    let h1_arr = [], h2_arr = []; let steps = 100;
    for(let i=0; i<=steps; i++) { let u1 = umin + (umax-umin)*(i/steps); h1_arr.push(calcH(M11*u1 + M12*umin, a1)); h2_arr.push(calcH(M21*u1 + M22*umin, a2)); }
    for(let i=0; i<=steps; i++) { let u2 = umin + (umax-umin)*(i/steps); h1_arr.push(calcH(M11*umax + M12*u2, a1)); h2_arr.push(calcH(M21*umax + M22*u2, a2)); }
    for(let i=steps; i>=0; i--) { let u1 = umin + (umax-umin)*(i/steps); h1_arr.push(calcH(M11*u1 + M12*umax, a1)); h2_arr.push(calcH(M21*u1 + M22*umax, a2)); }
    for(let i=steps; i>=0; i--) { let u2 = umin + (umax-umin)*(i/steps); h1_arr.push(calcH(M11*umin + M12*u2, a1)); h2_arr.push(calcH(M21*umin + M22*u2, a2)); }
    return {x: h1_arr, y: h2_arr};
}

// Genera las líneas de trayectoria cuando UNA bomba está apagada (SIMO)
function generar_trayectorias_1_bomba(umin, umax) {
    let c1_x = [], c1_y = [], c2_x = [], c2_y = [];
    let steps = 100;
    for(let i=0; i<=steps; i++) { 
        let u_activa = umin + (umax-umin)*(i/steps); 
        // Bomba 1 OFF, Bomba 2 ON
        c1_x.push(calcH(M11*0 + M12*u_activa, a1)); c1_y.push(calcH(M21*0 + M22*u_activa, a2));
        // Bomba 2 OFF, Bomba 1 ON
        c2_x.push(calcH(M11*u_activa + M12*0, a1)); c2_y.push(calcH(M21*u_activa + M22*0, a2));
    }
    return { cola1: {x: c1_x, y: c1_y}, cola2: {x: c2_x, y: c2_y} };
}

// Instanciar geometrías
const polyMIMO = generar_poligono_principal(U_MIN, U_MAX);
const trayectoriasSIMO = generar_trayectorias_1_bomba(U_MIN, U_MAX);

function actualizarSimulacion() {
    let h1_sp = parseFloat(document.getElementById('slider_h1').value) / 100;
    let h2_sp = parseFloat(document.getElementById('slider_h2').value) / 100;
    
    document.getElementById('val_h1').innerText = (h1_sp*100).toFixed(1);
    document.getElementById('val_h2').innerText = (h2_sp*100).toFixed(1);

    // 1. Cálculos de control
    let F1 = calcF(h1_sp, a1), F2 = calcF(h2_sp, a2);
    let u1 = I11*F1 + I12*F2;
    let u2 = I21*F1 + I22*F2;

    // Limpieza numérica rigurosa (como en Python)
    if(Math.abs(u1) < 1e-4) u1 = 0.0;
    if(Math.abs(u2) < 1e-4) u2 = 0.0;

    // 2. Efectos en Estanques Superiores
    let u1_eff = Math.max(0, Math.min(u1, 1.0));
    let u2_eff = Math.max(0, Math.min(u2, 1.0));
    let h3_calc = calcH((1 - gamma2) * k * u2_eff, a3);
    let h4_calc = calcH((1 - gamma1) * k * u1_eff, a4);
    
    updateTankFill('water_1', 'text_h1', h1_sp);
    updateTankFill('water_2', 'text_h2', h2_sp);
    updateTankFill('water_3', 'text_h3', h3_calc);
    updateTankFill('water_4', 'text_h4', h4_calc);

    // 3. Diagnóstico de Alcanzabilidad
    let is_feasible = es_alcanzable(u1) && es_alcanzable(u2);
    let rebalse = (h3_calc > H_MAX || h4_calc > H_MAX);
    
    let color_sp, texto_estado, textColor;

    if (!is_feasible) {
        color_sp = '#e74c3c'; // Red
        textColor = '#e74c3c';
        texto_estado = "INALCANZABLE (Saturación/Zona Muerta)";
    } else if (rebalse) {
        color_sp = '#f39c12'; // Orange
        textColor = '#f39c12';
        texto_estado = "PELIGRO (Rebalse Superior)";
    } else if ((u1 === 0 && u2 !== 0) || (u2 === 0 && u1 !== 0)) {
        color_sp = '#8e44ad'; // Purple
        textColor = '#8e44ad';
        texto_estado = "ALCANZABLE (Operación SIMO - 1 Bomba)";
    } else {
        color_sp = '#2ecc71'; // Green
        textColor = '#27ae60';
        texto_estado = "ALCANZABLE (Operación MIMO Segura)";
    }

    // 4. Reporte en Pantalla
    let rep = `<strong>ESTADO DEL SISTEMA: <span style="color:${textColor};">${texto_estado}</span></strong><br>`;
    rep += `-----------------------------------------<br>`;
    rep += `Esfuerzo Bomba 1 (U1): ${(u1*100).toFixed(1)}%<br>`;
    rep += `Esfuerzo Bomba 2 (U2): ${(u2*100).toFixed(1)}%<br>`;
    rep += `-----------------------------------------<br>`;
    rep += `[INFO] Consecuencia en esclavo 3: ${(h3_calc*100).toFixed(1)} cm<br>`;
    rep += `[INFO] Consecuencia en esclavo 4: ${(h4_calc*100).toFixed(1)} cm`;
    
    document.getElementById('report_div').innerHTML = rep;

    // 5. Gráficos Plotly (Replica exacta visual)
    let traces = [
        // Envolvente principal 2D (Ambas bombas ON)
        { x: polyMIMO.x, y: polyMIMO.y, fill: 'toself', fillcolor: 'rgba(65, 105, 225, 0.3)', line: {color: '#4169E1'}, name: `MIMO (${U_MIN*100}% - ${U_MAX*100}%)` },
        // Curva Bomba 1 Apagada
        { x: trayectoriasSIMO.cola1.x, y: trayectoriasSIMO.cola1.y, mode: 'lines', line: {color: '#8e44ad', width: 3, dash: 'dash'}, name: 'SIMO (Bomba 1 OFF)' },
        // Curva Bomba 2 Apagada
        { x: trayectoriasSIMO.cola2.x, y: trayectoriasSIMO.cola2.y, mode: 'lines', line: {color: '#27ae60', width: 3, dash: 'dash'}, name: 'SIMO (Bomba 2 OFF)' },
        // Origen (Ambas Apagadas)
        { x: [0], y: [0], mode: 'markers', marker: {color: 'black', size: 8}, name: 'Planta Apagada' },
        // Setpoint Solicitado
        { x: [h1_sp], y: [h2_sp], mode: 'markers', marker: {color: color_sp, size: 14, symbol: 'x', line: {color: 'black', width: 1}}, name: 'SP Deseado' }
    ];

    let layout = {
        margin: {l: 40, r: 20, b: 40, t: 30}, height: 380,
        title: { text: 'Espacio de Puntos Utilizables', font: {size: 14} },
        xaxis: {title: 'Nivel Estanque 1 (m)', range: [-0.02, 0.65], gridcolor: '#e5e5e5'},
        yaxis: {title: 'Nivel Estanque 2 (m)', range: [-0.02, 0.65], gridcolor: '#e5e5e5'},
        plot_bgcolor: '#f8f9fa', paper_bgcolor: '#f8f9fa',
        legend: { x: 0.05, y: 0.95, bgcolor: 'rgba(255,255,255,0.8)' }
    };

    Plotly.newPlot('plot_div', traces, layout, {responsive: true});
}

// --- LÓGICA DE SINCRONIZACIÓN (SLIDER <-> INPUT %) ---
function syncH1(fromSlider) {
    let slider = document.getElementById('slider_h1');
    let inputPct = document.getElementById('input_h1_pct');
    if(fromSlider) {
        inputPct.value = ((parseFloat(slider.value) / (H_MAX * 100)) * 100).toFixed(1);
    } else {
        slider.value = Math.min(Math.max((parseFloat(inputPct.value) / 100) * (H_MAX * 100), 0), H_MAX * 100); 
    }
    actualizarSimulacion();
}

function syncH2(fromSlider) {
    let slider = document.getElementById('slider_h2');
    let inputPct = document.getElementById('input_h2_pct');
    if(fromSlider) {
        inputPct.value = ((parseFloat(slider.value) / (H_MAX * 100)) * 100).toFixed(1);
    } else {
        slider.value = Math.min(Math.max((parseFloat(inputPct.value) / 100) * (H_MAX * 100), 0), H_MAX * 100); 
    }
    actualizarSimulacion();
}

// Asignar los Event Listeners a la interfaz
document.getElementById('slider_h1').addEventListener('input', () => syncH1(true));
document.getElementById('slider_h2').addEventListener('input', () => syncH2(true));
document.getElementById('input_h1_pct').addEventListener('input', () => syncH1(false));
document.getElementById('input_h2_pct').addEventListener('input', () => syncH2(false));

// Primera ejecución al cargar la web
actualizarSimulacion();
</script>
</body>
</html>
